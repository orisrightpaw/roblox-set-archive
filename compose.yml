services:
    web:
        image: ghcr.io/orisrightpaw/roblox-set-archive:web
        restart: unless-stopped
        depends_on:
            - api
        ports:
            - '8080:8080'
        networks:
            - default
    api:
        image: ghcr.io/orisrightpaw/roblox-set-archive:api
        restart: unless-stopped
        depends_on:
            - database
        environment:
            DATABASE_URL: 'host=database user=postgres password=roblox-set-archive dbname=roblox-set-archive port=5432 sslmode=disable'
        networks:
            - default
    database:
        image: postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: roblox-set-archive
            POSTGRES_PASSWORD: roblox-set-archive
        volumes:
            - ./data/psql:/var/lib/postgresql
        networks:
            - default
networks:
    default:
